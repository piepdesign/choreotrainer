<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ChoreoTrainer</title>
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='4' y='42' textLength='50' lengthAdjust='spacingAndGlyphs' font-family='Arial Black,Helvetica Neue,Arial,sans-serif' font-weight='900' font-size='28' fill='%23fff'%3EC%E2%80%93T%3C/text%3E%3Ctext x='55' y='26' font-family='Arial,sans-serif' font-weight='700' font-size='10' fill='%23fff' text-anchor='middle'%3E%C2%A9%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Theme vor dem ersten Rendern setzen, damit nichts flackert
    try { const t = localStorage.getItem('ct-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
    // Bis klar ist, ob das Intro läuft, nichts von der App zeigen (kein aufblitzendes Menü)
    document.documentElement.classList.add('booting');
    // Touch-Geräte (Handy, Tablet): kein Hover, keine Tastenkürzel → eigene Bedienung und Texte
    if (matchMedia('(hover: none) and (pointer: coarse)').matches) document.documentElement.classList.add('touch');
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <button class="back-btn" type="button" aria-label="Zurück" title="Zurück" hidden><svg viewBox="0 0 8 12" width="8" height="12" aria-hidden="true"><path d="M7 1 2 6l5 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
      <a class="wordmark" href="#/">CHOREO—TRAINER<sup>©</sup></a>
    </div>
    <nav>
      <a href="#/" data-nav="hub">BASE</a>
      <a href="#/profile" data-nav="profile">PROFIL</a>
      <a class="icon-link" href="#/settings" data-nav="settings" aria-label="Einstellungen" title="Einstellungen"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M8.6 1.5h2.8l.4 2.3 1.6.7 1.9-1.4 2 2-1.4 1.9.7 1.6 2.3.4v2.8l-2.3.4-.7 1.6 1.4 1.9-2 2-1.9-1.4-1.6.7-.4 2.3H8.6l-.4-2.3-1.6-.7-1.9 1.4-2-2 1.4-1.9-.7-1.6-2.3-.4V8.6l2.3-.4.7-1.6-1.4-1.9 2-2 1.9 1.4 1.6-.7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></a>
      <button class="theme-toggle" type="button" aria-label="Hell/Dunkel umschalten" title="Hell/Dunkel">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="8.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 1.75a8.25 8.25 0 0 1 0 16.5z" fill="currentColor"/></svg>
      </button>
    </nav>
  </header>
  <main id="view"></main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
